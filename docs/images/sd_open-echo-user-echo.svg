="#A9B7C6" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.7754" x="473.2065" y="225.2988">Create `echoes`, `expanded`, and `commandByMessage`</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg6"><polygon fill="#A9B7C6" points="841.9819,268.3516,851.9819,272.3516,841.9819,276.3516,845.9819,272.3516" style="stroke:#A9B7C6;stroke-width:1;"/><line style="stroke:#A9B7C6;stroke-width:1;" x1="453.6309" x2="847.9819" y1="272.3516" y2="272.3516"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="475.7034" y="267.6094">6</text><text fill="#A9B7C6" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.6304" x="488.2791" y="267.6094">Subscribe to `command.executed` and `session.idle`</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg7"><polygon fill="#A9B7C6" points="140.0688,297.6621,130.0688,301.6621,140.0688,305.6621,136.0688,301.6621" style="stroke:#A9B7C6;stroke-width:1;"/><line style="stroke:#A9B7C6;stroke-width:1;" x1="134.0688" x2="452.6309" y1="301.6621" y2="301.6621"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="173.4639" y="296.9199">7</text><text fill="#A9B7C6" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.1963" x="186.0396" y="296.9199">Register the `session_prompt` slot</text></g><path d="M30,319.6621 L30,349.6621 A5,5 0 0 0 35,354.6621 L547,354.6621 A5,5 0 0 0 552,349.6621 L552,324.6621 L542,314.6621 L35,314.6621 A5,5 0 0 0 30,319.6621" fill="#FFFACD" style="stroke:#A9B7C6;stroke-width:0.5;"/><path d="M542,314.6621 L542,322.1621 A2.5,2.5 0 0 0 544.5,324.6621 L552,324.6621 L542,314.6621" fill="#FFFACD" style="stroke:#A9B7C6;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.0015" x="36" y="332.2305">To preserve the native input experience, `session_prompt` uses replace mode:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.8745" x="36" y="347.541">render the echo panel first, then mount `api.ui.Prompt` again.</text><path d="M394.0801,367.2832 L456.2651,367.2832 L456.2651,374.5938 L446.2651,384.5938 L389.0801,384.5938 L389.0801,372.2832 A5,5 0 0 1 394.0801,367.2832" fill="#2B2B2B" style="stroke:#A9B7C6;stroke-width:1.5;"/><rect fill="none" height="139.5527" rx="5" ry="5" style="stroke:#A9B7C6;stroke-width:1.5;" width="514.335" x="389.0801" y="367.2832"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="404.0801" y="380.8516">opt</text><text fill="#A9B7C6" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.2871" x="471.2651" y="379.918">[User executes slash command]</text><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg8"><polygon fill="#A9B7C6" points="464.6309,401.9043,454.6309,405.9043,464.6309,409.9043,460.6309,405.9043" style="stroke:#A9B7C6;stroke-width:1;"/><line style="stroke:#A9B7C6;stroke-width:1;" x1="458.6309" x2="852.9819" y1="405.9043" y2="405.9043"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="479.6738" y="401.1621">8</text><text fill="#A9B7C6" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6895" x="492.2495" y="401.1621">`command.executed(messageID, name, arguments)`</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg9"><line style="stroke:#A9B7C6;stroke-width:1;" x1="453.6309" x2="495.6309" y1="435.2148" y2="435.2148"/><line style="stroke:#A9B7C6;stroke-width:1;" x1="495.6309" x2="495.6309" y1="435.2148" y2="448.2148"/><line style="stroke:#A9B7C6;stroke-width:1;" x1="454.6309" x2="495.6309" y1="448.2148" y2="448.2148"/><polygon fill="#A9B7C6" points="464.6309,444.2148,454.6309,448.2148,464.6309,452.2148,460.6309,448.2148" style="stroke:#A9B7C6;stroke-width:1;"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="460.6309" y="430.4727">9</text><text fill="#A9B7C6" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.5845" x="473.2065" y="430.4727">Record `messageID -&gt; /name arguments`</text></g><path d="M458,466.2148 L458,496.2148 A5,5 0 0 0 463,501.2148 L843,501.2148 A5,5 0 0 0 848,496.2148 L848,471.2148 L838,461.2148 L463,461.2148 A5,5 0 0 0 458,466.2148" fill="#FFFACD" style="stroke:#A9B7C6;stroke-width:0.5;"/><path d="M838,461.2148 L838,468.7148 A2.5,2.5 0 0 0 840.5,471.2148 L848,471.2148 L838,461.2148" fill="#FFFACD" style="stroke:#A9B7C6;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.2241" x="464" y="478.7832">To keep the original command visible after `session.idle`,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.5938" x="464" y="494.0938">use `messageID` as a temporary mapping key.</text><path d="M68.0244,520.8359 L130.2095,520.8359 L130.2095,528.1465 L120.2095,538.1465 L63.0244,538.1465 L63.0244,525.8359 A5,5 0 0 1 68.0244,520.8359" fill="#2B2B2B" style="stroke:#A9B7C6;stroke-width:1.5;"/><rect fill="none" height="155.8633" rx="5" ry="5" style="stroke:#A9B7C6;stroke-width:1.5;" width="1744.8174" x="63.0244" y="520.8359"/><text fill="#A9B7C6" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.1851" x="78.0244" y="534.4043">opt</text><text fill="#A9B7C6" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.6362" x="145.2095" y="533.4707">[User submits a message]</text><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg1